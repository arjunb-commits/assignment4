<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Matching Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Memory Matching Game</h1>
  <div>Time: <span id="clock"></span> <button type="button" id="muteBtn" aria-pressed="false">Sound: on</button></div>
</header>
<nav><a href="index.html">&larr; Back to the Number Guessing Game</a></nav>

<section class="panel" aria-label="Game controls">
  <label for="pairs">Pairs</label>
  <select id="pairs">
    <option value="8">8 pairs (120 s)</option>
    <option value="10">10 pairs (150 s)</option>
    <option value="12">12 pairs (180 s)</option>
  </select>
  <label for="memorize">Memorize time</label>
  <select id="memorize">
    <option value="8">Easy: 8 s</option>
    <option value="5" selected>Medium: 5 s</option>
    <option value="3">Hard: 3 s</option>
  </select>
  <label><input type="checkbox" id="adaptive" checked> Adaptive difficulty</label>
  <button type="button" id="startBtn">Start game</button>
</section>

<section class="panel" aria-label="Game board">
  <p class="stats">
    <span id="score">Score: 0</span>
    <span id="matches">Matches: 0/0</span>
    <span id="mistakes">Mistakes: 0</span>
    <span id="timer">Press Start</span>
  </p>
  <p id="status" role="status">Choose your settings and press <strong>Start game</strong>.</p>
  <table id="board" aria-label="Memory cards"></table>
  <p id="result" role="status"></p>
</section>

<section class="panel" aria-label="Leaderboard">
  <h2>Leaderboard (top 5)</h2>
  <ol id="leaderboard"></ol>
  <button type="button" id="clearBoard">Clear leaderboard</button>
</section>

<script src="common.js"></script>
<script src="memory.js"></script>
</body>
</html>
